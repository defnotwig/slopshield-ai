name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @slopshield/api run db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Build projects
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run lints
        run: pnpm lint

      - name: Run tests
        # Web_App tests run in non-watch single-run mode via `vitest run`
        # (the @slopshield/web `test` script), so CI never hangs (Req 12.2, C3).
        run: pnpm test
