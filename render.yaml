# Render Blueprint for the SlopShield AI backend (apps/api).
# Provisions a Render Free Web Service that runs the NestJS API and the
# in-process BullMQ scan worker. Build runs from the monorepo root so the
# pnpm workspace dependencies (@slopshield/shared, @slopshield/scanner-plugins)
# resolve. Secrets are declared with `sync: false` and supplied in the Render
# dashboard so no credential values are committed.
services:
  - type: web
    name: slopshield-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .                     # build from monorepo root so pnpm workspaces resolve
    healthCheckPath: /api/health
    # Install pnpm via npm (not corepack): Node 20.18.0's bundled corepack has
    # stale signing keys and fails to verify pnpm's signature on Render.
    # --prod=false forces devDependencies (prisma, nest CLI, typescript) to be
    # installed even though NODE_ENV=production, so the build can run.
    # Migrations run in the build step here because Render Free does not support
    # preDeployCommand; `migrate deploy` is a no-op when already in sync.
    buildCommand: |
      npm install -g pnpm@9.15.0
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @slopshield/api... build      # builds @slopshield/shared + scanner-plugins first (Turbo ^build)
      pnpm --filter @slopshield/api exec prisma generate
      pnpm --filter @slopshield/api exec prisma migrate deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_WEBHOOK_VERIFICATION_TOKEN
        sync: false
      - key: LARK_DEFAULT_CHAT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false
      - key: LARK_OAUTH_APP_ID
        sync: false
      - key: LARK_OAUTH_APP_SECRET
        sync: false
      - key: LARK_OAUTH_CALLBACK_URL
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: ANALYZER_TIMEOUT_MS
        value: "45000"
      - key: MAX_ANALYZE_FILES
        value: "50"
